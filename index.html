<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Room</title>

  <!-- Firebase & PeerJS Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .card-title {
      font-size: 26px;
      font-weight: 800;
      color: #000000;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background-color: #ffffff;
      color: #333333;
    }
    input::placeholder {
      color: #a0a0a0;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #joinBtn {
      background-color: #007bff;
      color: #ffffff;
    }
    #joinBtn:disabled {
      background-color: #d1d5db;
      color: #ffffff;
      cursor: not-allowed;
    }
    #muteBtn {
      background-color: #28a745;
      color: #ffffff;
    }
    #muteBtn.muted {
      background-color: #dc3545;
    }
    #muteBtn:disabled {
      background-color: #28a745;
      opacity: 0.9;
      cursor: not-allowed;
    }
    #leaveBtn {
      background-color: #6c757d;
      color: #ffffff;
    }
    #leaveBtn:disabled {
      background-color: #6c757d;
      opacity: 0.9;
      cursor: not-allowed;
    }
    .status {
      margin: 18px 0 14px 0;
      font-weight: 600;
      color: #495057;
      font-size: 14px;
    }
    .user-list {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #f1f3f5;
      text-align: left;
    }
    .user-list-title {
      font-weight: 700;
      font-size: 15px;
      color: #000000;
      margin-bottom: 12px;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e9ecef;
      font-size: 14px;
    }
    .user-item:last-child {
      border-bottom: none;
    }
    .badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      text-transform: lowercase;
    }
    .badge-connected {
      background-color: #28a745;
    }
    .badge-connecting {
      background-color: #ffc107;
      color: #212529;
    }
    .badge-disconnected {
      background-color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">
      🎙️ Voice Room
    </div>

    <input type="text" id="roomIdInput" placeholder="Room ID (e.g. dubai123)">
    <input type="text" id="usernameInput" placeholder="Your Name">
    
    <button id="joinBtn" onclick="joinRoom()">Join Room</button>
    <button id="muteBtn" onclick="toggleMute()" disabled>Mute</button>
    <button id="leaveBtn" onclick="leaveRoom()" disabled>Disconnect / Leave</button>

    <div class="status" id="statusText">Not connected</div>

    <div class="user-list">
      <div class="user-list-title">Active Members:</div>
      <div id="membersContainer">
        <span style="color: #888; font-size: 13px;">No users in room</span>
      </div>
    </div>

    <div id="audioContainer"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAht-2uvNYjZsT5MclMLCXbf5QOkIbgQP4",
      authDomain: "voiceroom-49a3f.firebaseapp.com",
      databaseURL: "https://voiceroom-49a3f-default-rtdb.firebaseio.com",
      projectId: "voiceroom-49a3f",
      storageBucket: "voiceroom-49a3f.firebasestorage.app",
      messagingSenderId: "862530914748",
      appId: "1:862530914748:web:8694d1c274b93674b7c3b9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let peer;
    let localStream;
    let myUid;
    let currentRoomId;
    let roomUsers = {};
    let calls = {};
    let isMuted = false;

    async function joinRoom() {
      const roomId = document.getElementById('roomIdInput').value.trim().toLowerCase();
      const username = document.getElementById('usernameInput').value.trim();

      if (!roomId || !username) {
        alert("Room ID aur Name dono daalo!");
        return;
      }

      currentRoomId = roomId;
      myUid = username.replace(/\s+/g, '_') + '_' + Math.random().toString(36).substr(2, 4);

      document.getElementById('joinBtn').disabled = true;
      document.getElementById('statusText').innerText = "Starting Mic...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        peer = new Peer(myUid, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', () => {
          document.getElementById('statusText').innerText = "Connected to Room: " + roomId;
          document.getElementById('muteBtn').disabled = false;
          document.getElementById('leaveBtn').disabled = false;

          const userRef = db.ref(`rooms_v3/${roomId}/users/${myUid}`);
          userRef.set({ name: username, peerId: myUid, status: 'connected' });
          userRef.onDisconnect().remove();

          db.ref(`rooms_v3/${roomId}/users`).on('value', snapshot => {
            roomUsers = snapshot.val() || {};
            renderUserList();
            connectToNewPeers();
          });
        });

        peer.on('call', (call) => {
          call.answer(localStream);
          handleCallStream(call);
        });

      } catch (e) {
        alert("Microphone permission required!");
        document.getElementById('joinBtn').disabled = false;
        document.getElementById('statusText').innerText = "Mic Error";
      }
    }

    function connectToNewPeers() {
      Object.keys(roomUsers).forEach(uid => {
        if (uid !== myUid && !calls[uid]) {
          const peerId = roomUsers[uid].peerId;
          const call = peer.call(peerId, localStream);
          if (call) {
            calls[uid] = call;
            handleCallStream(call);
          }
        }
      });
    }

    function handleCallStream(call) {
      call.on('stream', (remoteStream) => {
        let audio = document.getElementById(`aud_${call.peer}`);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = `aud_${call.peer}`;
          audio.autoplay = true;
          audio.playsInline = true;
          document.getElementById('audioContainer').appendChild(audio);
        }
        audio.srcObject = remoteStream;
      });
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      const muteBtn = document.getElementById('muteBtn');
      muteBtn.innerText = isMuted ? "Unmute" : "Mute";
      muteBtn.classList.toggle('muted', isMuted);
    }

    function leaveRoom() {
      location.reload();
    }

    function renderUserList() {
      const container = document.getElementById('membersContainer');
      container.innerHTML = '';

      const uids = Object.keys(roomUsers);
      if (uids.length === 0) {
        container.innerHTML = '<span style="color: #888; font-size: 13px;">No users in room</span>';
        return;
      }

      uids.forEach(uid => {
        const u = roomUsers[uid];
        const item = document.createElement('div');
        item.className = 'user-item';

        const isMe = uid === myUid ? " (You)" : "";
        item.innerHTML = `
          <span><strong>${u.name}</strong>${isMe}</span>
          <span class="badge badge-connected">connected</span>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
