<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Room</title>
  
  <!-- PeerJS Library for direct peer connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 90%; max-width: 360px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; }
    button { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; background-color: #007bff; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:disabled { background-color: #d6d8db; cursor: not-allowed; }
    #muteBtn { background-color: #28a745; }
    #muteBtn.muted { background-color: #dc3545; }
    #leaveBtn { background-color: #6c757d; }
    .status { margin-top: 15px; font-weight: 600; color: #495057; font-size: 14px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; margin-top: 8px; }
    .connected { background-color: #28a745; }
    .connecting { background-color: #ffc107; color: #212529; }
    .disconnected { background-color: #dc3545; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎙️ Voice Call</h2>
    
    <div id="setupSec">
      <input type="text" id="myIdInput" placeholder="Your Unique ID (e.g. akshay1)">
      <button id="initBtn" onclick="initPeer()">Start Mic Engine</button>
    </div>

    <div id="callSec" style="display:none;">
      <p>Your ID: <strong id="displayMyId"></strong></p>
      <input type="text" id="peerIdInput" placeholder="Friend's ID (e.g. friend1)">
      
      <button id="callBtn" onclick="makeCall()">Call Friend</button>
      <button id="muteBtn" onclick="toggleMute()">Mute</button>
      <button id="leaveBtn" onclick="endCall()">End Call</button>
    </div>

    <div class="status" id="statusText">Status: Enter your ID to start</div>
    <div id="badgeStatus"></div>

    <div id="audioContainer"></div>
  </div>

  <script>
    let peer;
    let localStream;
    let currentCall;
    let isMuted = false;

    async function initPeer() {
      const myId = document.getElementById('myIdInput').value.trim().toLowerCase();
      if (!myId) return alert("Pehle apna Unique ID dalo!");

      document.getElementById('statusText').innerText = "Requesting Mic Permission...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        // Initialize PeerJS with Google STUN Fallbacks
        peer = new Peer(myId, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', (id) => {
          document.getElementById('setupSec').style.display = 'none';
          document.getElementById('callSec').style.display = 'block';
          document.getElementById('displayMyId').innerText = id;
          document.getElementById('statusText').innerText = "Ready to connect!";
          updateBadge("Ready", "connecting");
        });

        // Answer incoming calls automatically
        peer.on('call', (call) => {
          currentCall = call;
          call.answer(localStream);
          handleStream(call);
        });

        peer.on('error', (err) => {
          alert("Error: " + err.type + " - ID shayad pehle se in-use hai!");
          document.getElementById('statusText').innerText = "Connection Error";
        });

      } catch (e) {
        alert("Microphone permission allowed nahi hai!");
        document.getElementById('statusText').innerText = "Mic Permission Denied";
      }
    }

    function makeCall() {
      const friendId = document.getElementById('peerIdInput').value.trim().toLowerCase();
      if (!friendId) return alert("Dost ki ID dalo!");

      document.getElementById('statusText').innerText = "Calling " + friendId + "...";
      updateBadge("Connecting...", "connecting");

      const call = peer.call(friendId, localStream);
      currentCall = call;
      handleStream(call);
    }

    function handleStream(call) {
      call.on('stream', (remoteStream) => {
        let audio = document.getElementById('remoteAudio');
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'remoteAudio';
          audio.autoplay = true;
          audio.playsInline = true;
          document.getElementById('audioContainer').appendChild(audio);
        }
        audio.srcObject = remoteStream;
        audio.play().catch(e => console.log(e));

        document.getElementById('statusText').innerText = "Connected in Voice Call!";
        updateBadge("CONNECTED", "connected");
      });

      call.on('close', () => {
        endCall();
      });
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      const muteBtn = document.getElementById('muteBtn');
      muteBtn.innerText = isMuted ? "Unmute" : "Mute";
      muteBtn.classList.toggle('muted', isMuted);
    }

    function endCall() {
      location.reload();
    }

    function updateBadge(text, typeClass) {
      const badge = document.getElementById('badgeStatus');
      badge.innerHTML = `<span class="badge ${typeClass}">${text}</span>`;
    }
  </script>
</body>
</html>
