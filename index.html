<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Room</title>
  
  <!-- Mobile Debugging Tool -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      box-sizing: border-box;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      background-color: #d6d8db;
      cursor: not-allowed;
    }
    #muteBtn {
      background-color: #28a745;
    }
    #muteBtn.muted {
      background-color: #dc3545;
    }
    #leaveBtn {
      background-color: #6c757d;
    }
    .status {
      margin-top: 15px;
      font-weight: 600;
      color: #495057;
      font-size: 14px;
    }
    .user-list {
      margin-top: 20px;
      text-align: left;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      max-height: 180px;
      overflow-y: auto;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #dee2e6;
      font-size: 14px;
    }
    .user-item:last-child {
      border-bottom: none;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    .badge-connected { background-color: #28a745; }
    .badge-reconnecting { background-color: #ffc107; color: #212529; }
    .badge-disconnected { background-color: #dc3545; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎙️ Voice Room</h2>
    <input type="text" id="roomIdInput" placeholder="Room ID (e.g. dubai123)">
    <input type="text" id="usernameInput" placeholder="Your Name">
    
    <button id="joinBtn" onclick="joinRoom()">Join Room</button>
    <button id="muteBtn" onclick="toggleMute()" disabled>Mute</button>
    <button id="leaveBtn" onclick="leaveRoom()" disabled>Disconnect / Leave</button>

    <div class="status" id="statusText">Not connected</div>

    <div class="user-list">
      <strong>Active Members:</strong>
      <div id="membersContainer" style="margin-top: 8px;">
        <span style="color: #888; font-size: 12px;">No users in room</span>
      </div>
    </div>

    <div id="audioContainer"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAht-2uvNYjZsT5MclMLCXbf5QOkIbgQP4",
      authDomain: "voiceroom-49a3f.firebaseapp.com",
      databaseURL: "https://voiceroom-49a3f-default-rtdb.firebaseio.com",
      projectId: "voiceroom-49a3f",
      storageBucket: "voiceroom-49a3f.firebasestorage.app",
      messagingSenderId: "862530914748",
      appId: "1:862530914748:web:8694d1c274b93674b7c3b9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.relay.metered.ca:80' },
        {
          urls: 'turn:global.relay.metered.ca:80',
          username: 'fbb7b44cd0db1a6b75784c62',
          credential: 'DKPbtCSJBOMoFML4'
        },
        {
          urls: 'turn:global.relay.metered.ca:443',
          username: 'fbb7b44cd0db1a6b75784c62',
          credential: 'DKPbtCSJBOMoFML4'
        },
        {
          urls: 'turn:global.relay.metered.ca:443?transport=tcp',
          username: 'fbb7b44cd0db1a6b75784c62',
          credential: 'DKPbtCSJBOMoFML4'
        }
      ]
    };

    let localStream;
    let myUid;
    let myName;
    let currentRoomId;
    let peerConnections = {};
    let roomUsers = {};
    let isMuted = false;

    async function joinRoom() {
      const roomId = document.getElementById('roomIdInput').value.trim();
      const username = document.getElementById('usernameInput').value.trim();

      if (!roomId || !username) {
        alert("Room ID aur Name dono daalo!");
        return;
      }

      currentRoomId = roomId;
      myName = username;
      myUid = username + "_" + Math.random().toString(36).substr(2, 5);

      document.getElementById('joinBtn').disabled = true;
      document.getElementById('statusText').innerText = "Connecting Mic...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('statusText').innerText = "Connected to Room: " + roomId;
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('leaveBtn').disabled = false;

        const roomRef = db.ref(`rooms/${roomId}`);
        const userRef = roomRef.child(`users/${myUid}`);

        userRef.set({ name: username, status: 'connecting' });
        userRef.onDisconnect().remove();

        roomRef.child('users').on('value', snapshot => {
          roomUsers = snapshot.val() || {};
          renderUserList();
        });

        roomRef.child('users').on('child_added', snapshot => {
          const peerUid = snapshot.key;
          if (peerUid !== myUid && !peerConnections[peerUid]) {
            createPeerConnection(peerUid, true);
          }
        });

        db.ref(`signals/${roomId}/${myUid}`).on('child_added', async snapshot => {
          const signal = snapshot.val();
          const fromUid = signal.from;

          if (!peerConnections[fromUid]) {
            createPeerConnection(fromUid, false);
          }

          const pc = peerConnections[fromUid];

          try {
            if (signal.type === 'offer') {
              await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);

              db.ref(`signals/${roomId}/${fromUid}`).push({
                from: myUid,
                type: 'answer',
                sdp: answer
              });
            } else if (signal.type === 'answer') {
              await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            } else if (signal.type === 'candidate') {
              await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
          } catch (e) {
            console.error("Signaling error:", e);
          }

          snapshot.ref.remove();
        });

      } catch (err) {
        console.error("Mic access error:", err);
        document.getElementById('statusText').innerText = "Mic access denied!";
        document.getElementById('joinBtn').disabled = false;
      }
    }

    function createPeerConnection(peerUid, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[peerUid] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = event => {
        if (event.candidate) {
          db.ref(`signals/${currentRoomId}/${peerUid}`).push({
            from: myUid,
            type: 'candidate',
            candidate: event.candidate.toJSON()
          });
        }
      };

      pc.oniceconnectionstatechange = () => {
        let status = 'connecting';
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          status = 'connected';
        } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          status = 'disconnected';
        } else if (pc.iceConnectionState === 'checking') {
          status = 'reconnecting';
        }
        updateMyStatus(status);
      };

      pc.ontrack = event => {
        let audioEl = document.getElementById(`audio_${peerUid}`);
        if (!audioEl) {
          audioEl = document.createElement('audio');
          audioEl.id = `audio_${peerUid}`;
          audioEl.autoplay = true;
          audioEl.setAttribute('playsinline', 'true');
          document.getElementById('audioContainer').appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
        audioEl.play().catch(e => console.log("Audio play error:", e));
      };

      if (isInitiator) {
        pc.onnegotiationneeded = async () => {
          try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            db.ref(`signals/${currentRoomId}/${peerUid}`).push({
              from: myUid,
              type: 'offer',
              sdp: offer
            });
          } catch (e) {
            console.error("Offer creation error:", e);
          }
        };
      }
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;

      const muteBtn = document.getElementById('muteBtn');
      if (isMuted) {
        muteBtn.innerText = "Unmute";
        muteBtn.classList.add('muted');
      } else {
        muteBtn.innerText = "Mute";
        muteBtn.classList.remove('muted');
      }
    }

    function leaveRoom() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      Object.keys(peerConnections).forEach(peerUid => {
        peerConnections[peerUid].close();
      });

      if (currentRoomId && myUid) {
        db.ref(`rooms/${currentRoomId}/users/${myUid}`).remove();
        db.ref(`signals/${currentRoomId}/${myUid}`).off();
        db.ref(`rooms/${currentRoomId}/users`).off();
      }

      peerConnections = {};
      roomUsers = {};

      document.getElementById('audioContainer').innerHTML = '';
      document.getElementById('membersContainer').innerHTML = '<span style="color: #888; font-size: 12px;">No users in room</span>';
      document.getElementById('statusText').innerText = "Disconnected";
      
      document.getElementById('joinBtn').disabled = false;
      document.getElementById('muteBtn').disabled = true;
      document.getElementById('leaveBtn').disabled = true;
      document.getElementById('muteBtn').innerText = "Mute";
      document.getElementById('muteBtn').classList.remove('muted');
      isMuted = false;
    }

    function updateMyStatus(status) {
      if (currentRoomId && myUid) {
        db.ref(`rooms/${currentRoomId}/users/${myUid}/status`).set(status);
      }
    }

    function renderUserList() {
      const container = document.getElementById('membersContainer');
      container.innerHTML = '';

      const uids = Object.keys(roomUsers);
      if (uids.length === 0) {
        container.innerHTML = '<span style="color: #888; font-size: 12px;">No users in room</span>';
        return;
      }

      uids.forEach(uid => {
        const u = roomUsers[uid];
        const item = document.createElement('div');
        item.className = 'user-item';

        const statusStr = u.status || 'connecting';
        let badgeClass = 'badge-reconnecting';
        if (statusStr === 'connected') badgeClass = 'badge-connected';
        if (statusStr === 'disconnected') badgeClass = 'badge-disconnected';

        const isMe = uid === myUid ? " (You)" : "";
        item.innerHTML = `
          <span><strong>${u.name}</strong>${isMe}</span>
          <span class="badge ${badgeClass}">${statusStr}</span>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
